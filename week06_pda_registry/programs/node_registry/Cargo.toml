[package]
name = "node_registry"
version = "0.1.0"
description = "Anchor PDA node passport registry with rent-reclaiming revocation"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "node_registry"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
blake3 = "=1.5.5"
constant_time_eq = "=0.3.1"
