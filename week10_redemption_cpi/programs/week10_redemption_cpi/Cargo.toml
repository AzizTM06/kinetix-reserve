[package]
name = "week10_redemption_cpi"
version = "0.1.0"
description = "Kinetix Reserve CPI Redemption & Circuit Breaker (Week 10)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "week10_redemption_cpi"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["token", "associated_token"] }
blake3 = "=1.5.5"
constant_time_eq = "=0.3.1"
